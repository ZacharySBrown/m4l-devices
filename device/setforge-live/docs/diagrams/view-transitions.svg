<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff6a4d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="#1a1a1a"/>
  <text x="30" y="38" fill="#f0f0f0" font-size="22" font-weight="bold">setforge-live — View Transitions (state diagram)</text>
  <text x="30" y="62" fill="#9aa0a6" font-size="13">Four emergent "views" over THREE real variables: performanceView (solo|perRow), dualSongActive (bool), viewMode (perf|control)</text>

  <!-- Solo box -->
  <rect x="90" y="130" width="200" height="80" rx="10" fill="#243042" stroke="#5b86c9" stroke-width="2"/>
  <text x="190" y="165" fill="#eaf1ff" font-size="17" font-weight="bold" text-anchor="middle">Solo (default)</text>
  <text x="190" y="188" fill="#9fb6d8" font-size="11" text-anchor="middle">performanceView=='solo'</text>

  <!-- Per-row box -->
  <rect x="610" y="130" width="200" height="80" rx="10" fill="#2a3a2a" stroke="#5fa15f" stroke-width="2"/>
  <text x="710" y="165" fill="#eafeea" font-size="17" font-weight="bold" text-anchor="middle">Per-row</text>
  <text x="710" y="188" fill="#a8d6a8" font-size="11" text-anchor="middle">performanceView=='perRow'</text>

  <!-- Dual-song box -->
  <rect x="350" y="340" width="200" height="80" rx="10" fill="#3a2a3a" stroke="#b06ab0" stroke-width="2"/>
  <text x="450" y="375" fill="#f6e6f6" font-size="17" font-weight="bold" text-anchor="middle">Dual-song</text>
  <text x="450" y="398" fill="#d6a8d6" font-size="11" text-anchor="middle">dualSongActive==true</text>

  <!-- Control box (orthogonal overlay) -->
  <rect x="610" y="340" width="200" height="80" rx="10" fill="#3a3320" stroke="#c9a24a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="710" y="372" fill="#fbf0d6" font-size="17" font-weight="bold" text-anchor="middle">Control (overlay)</text>
  <text x="710" y="392" fill="#d8c79a" font-size="11" text-anchor="middle">viewMode=='control'</text>
  <text x="710" y="408" fill="#d8c79a" font-size="11" text-anchor="middle">hijacks Grid 1 only</text>

  <!-- solo <-> perRow : double-tap SOLO -->
  <line x1="290" y1="160" x2="606" y2="160" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="182" x2="294" y2="182" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="370" y="138" width="160" height="20" rx="4" fill="#1a1a1a"/>
  <text x="450" y="153" fill="#dfe3e8" font-size="12" text-anchor="middle">double-tap SOLO</text>
  <text x="450" y="206" fill="#9aa0a6" font-size="11" text-anchor="middle">(toggle, both directions)</text>

  <!-- any -> dualSong (from solo) -->
  <line x1="180" y1="210" x2="362" y2="338" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- any -> dualSong (from perRow) -->
  <line x1="690" y1="210" x2="538" y2="338" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="258" width="290" height="38" rx="5" fill="#1a1a1a"/>
  <text x="315" y="275" fill="#dfe3e8" font-size="12" text-anchor="middle">dual toggle (note 89):</text>
  <text x="315" y="290" fill="#dfe3e8" font-size="12" text-anchor="middle">hold = peek  /  double-tap = latch</text>

  <!-- dualSong -> prev -->
  <path d="M 360 408 C 230 470, 180 360, 180 214" fill="none" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="120" y="470" width="260" height="20" rx="4" fill="#1a1a1a"/>
  <text x="250" y="485" fill="#dfe3e8" font-size="12" text-anchor="middle">dualSong &#8594; prev: release / double-tap</text>
  <text x="250" y="506" fill="#9aa0a6" font-size="11" text-anchor="middle">(restores performanceView via preDualSongView)</text>

  <!-- performance <-> control : MODE_TOGGLE -->
  <line x1="710" y1="210" x2="710" y2="336" stroke="#c9a24a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <rect x="612" y="262" width="196" height="38" rx="5" fill="#1a1a1a"/>
  <text x="710" y="279" fill="#e8d59a" font-size="12" text-anchor="middle">MODE_TOGGLE (note 80)</text>
  <text x="710" y="294" fill="#bfae7a" font-size="11" text-anchor="middle">perf &#8596; control overlay</text>

  <!-- any -> solo : PANIC triple-tap -->
  <path d="M 350 380 C 200 300, 110 280, 120 214" fill="none" stroke="#ff6a4d" stroke-width="2.5" marker-end="url(#arrowP)"/>
  <rect x="60" y="318" width="250" height="20" rx="4" fill="#1a1a1a"/>
  <text x="185" y="333" fill="#ff8a72" font-size="12" text-anchor="middle">any &#8594; Solo: PANIC triple-tap (1s window)</text>

  <!-- Notes box -->
  <rect x="40" y="540" width="820" height="80" rx="8" fill="#202020" stroke="#444" stroke-width="1"/>
  <text x="55" y="563" fill="#cfcfcf" font-size="12" font-weight="bold">Notes</text>
  <text x="55" y="582" fill="#b6bcc2" font-size="11.5">• Control (dashed) is an ORTHOGONAL overlay — it can coexist with dual-song or per-row; it hijacks Grid 1 only, it is NOT a mutually-exclusive sibling view.</text>
  <text x="55" y="600" fill="#b6bcc2" font-size="11.5">• There is no single "view" enum. State = THREE live variables: performanceView, dualSongActive, viewMode. The 4-valued string exists only in serialized scenes.</text>
  <text x="55" y="616" fill="#b6bcc2" font-size="11.5">• PANIC reverts the perf/dual-song axis to Solo only; it does NOT clear viewMode (control), staging, or loadedDecks.</text>
</svg>
